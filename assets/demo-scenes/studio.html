<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { width:1920px; height:1080px; overflow:hidden;
         background:#0d1420; font-family: Inter, system-ui, sans-serif; }
  .room { position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 34% 42%, rgba(255,168,92,.20), transparent 55%),
      radial-gradient(90% 80% at 78% 30%, rgba(94,124,255,.20), transparent 60%),
      linear-gradient(180deg,#131c2c 0%, #0b111c 62%, #080d16 100%);
  }
  /* soft out-of-focus lights behind the subject */
  .bokeh { position:absolute; border-radius:50%; filter: blur(38px); opacity:.5 }
  .b1 { width:230px;height:230px; left:1180px; top:180px; background:#ffb066 }
  .b2 { width:170px;height:170px; left:1420px; top:360px; background:#6f8cff; opacity:.42 }
  .b3 { width:120px;height:120px; left:1330px; top:640px; background:#ff7ac0; opacity:.34 }
  .b4 { width:300px;height:300px; left:120px;  top:520px; background:#2b4a7a; opacity:.5 }
  /* desk */
  .desk { position:absolute; left:0; right:0; bottom:0; height:250px;
    background:linear-gradient(180deg,#1a2436 0%, #121a29 40%, #0c121e 100%);
    box-shadow: 0 -30px 60px rgba(0,0,0,.5) }
  .desk::before { content:""; position:absolute; inset:0 0 auto 0; height:2px;
    background:linear-gradient(90deg,transparent,rgba(255,190,130,.35),transparent) }
  /* the speaker, deliberately left of centre */
  .subject { position:absolute; left:560px; bottom:250px; width:520px; }
  .head { width:206px; height:236px; margin:0 auto; border-radius:104px 104px 92px 92px;
    background:linear-gradient(150deg,#e8b184 0%, #c98a5f 62%, #9a6642 100%);
    box-shadow: -26px 12px 40px rgba(0,0,0,.35), inset -18px -10px 34px rgba(0,0,0,.18) }
  .hair { position:absolute; left:50%; transform:translateX(-50%); top:-14px; width:222px; height:120px;
    border-radius:112px 112px 40px 40px; background:linear-gradient(160deg,#2a2118,#171009) }
  .cans { position:absolute; left:50%; transform:translateX(-50%); top:52px; width:268px; height:132px }
  .cans span { position:absolute; top:18px; width:52px; height:96px; border-radius:16px;
    background:linear-gradient(180deg,#2c3446,#1b2230); box-shadow:0 6px 14px rgba(0,0,0,.4) }
  .cans span:first-child { left:0 } .cans span:last-child { right:0 }
  .cans::after { content:""; position:absolute; left:26px; right:26px; top:-6px; height:26px;
    border-radius:120px 120px 0 0; border:9px solid #232b3b; border-bottom:none }
  .torso { width:430px; height:300px; margin:-26px auto 0; border-radius:150px 150px 26px 26px;
    background:linear-gradient(160deg,#3d4a63 0%, #2a3448 55%, #1d2536 100%);
    box-shadow: -30px 16px 50px rgba(0,0,0,.4) }
  /* rim light picks the subject off the background */
  .rim { position:absolute; left:552px; bottom:250px; width:20px; height:560px;
    background:linear-gradient(180deg, transparent, rgba(255,186,120,.5), transparent);
    filter: blur(9px) }
  /* mic */
  .mic { position:absolute; left:1010px; bottom:196px }
  .mic .grille { width:96px; height:150px; border-radius:48px;
    background:linear-gradient(150deg,#4a5468,#232b3a); box-shadow:0 10px 26px rgba(0,0,0,.45) }
  .mic .stem { width:16px; height:120px; margin:0 auto; background:linear-gradient(180deg,#39414f,#1d2430) }
  .vig { position:absolute; inset:0; box-shadow: inset 0 0 260px 90px rgba(0,0,0,.6) }
</style></head><body>
  <div class="room"></div>
  <div class="bokeh b1"></div><div class="bokeh b2"></div><div class="bokeh b3"></div><div class="bokeh b4"></div>
  <div class="desk"></div>
  <div class="rim"></div>
  <div class="subject">
    <div style="position:relative">
      <div class="head"></div><div class="hair"></div><div class="cans"><span></span><span></span></div>
    </div>
    <div class="torso"></div>
  </div>
  <div class="mic"><div class="grille"></div><div class="stem"></div></div>
  <div class="vig"></div>
</body></html>
