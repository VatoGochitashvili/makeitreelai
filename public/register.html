<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — MakeItReel</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="site">
  <div class="wrap">
    <a class="logo" href="/">
      <span class="dot"></span><span class="wm">makeit<span class="wm-reel">reel</span></span>
    </a>
    <div class="nav-right"><a class="btn ghost" href="/login.html">Log in</a></div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Start turning long videos into viral clips — free, no card required.</p>

    <div class="social-row">
      <button type="button" class="social-btn" data-oauth="google">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38Z"/></svg>
        Continue with Google
      </button>
      <button type="button" class="social-btn apple" data-oauth="apple">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.03-2.56 2.1-3.79 2.19-3.85-1.19-1.74-3.05-1.98-3.71-2.01-1.58-.16-3.08.93-3.88.93-.8 0-2.03-.91-3.34-.88-1.72.03-3.3.99-4.19 2.52-1.79 3.1-.46 7.69 1.28 10.2.85 1.23 1.86 2.61 3.19 2.56 1.28-.05 1.76-.83 3.31-.83 1.54 0 1.98.83 3.34.8 1.38-.02 2.25-1.25 3.09-2.49.97-1.42 1.37-2.8 1.39-2.87-.03-.01-2.67-1.03-2.7-4.08ZM14.09 4.79c.71-.86 1.19-2.05 1.06-3.24-1.02.04-2.26.68-2.99 1.54-.66.76-1.23 1.98-1.08 3.15 1.14.09 2.3-.58 3.01-1.45Z"/></svg>
        Continue with Apple
      </button>
    </div>
    <div class="oauth-divider">or sign up with email</div>

    <form id="form">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Alex Rivera" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
      </div>
      <div class="field">
        <label>Choose a plan <span style="color:var(--muted2);font-weight:500">— no charge yet</span></label>
        <div class="plan-pick" id="planPick">
          <input type="radio" name="plan" id="p-free" value="free">
          <label for="p-free">Free<small>$0/mo</small></label>
          <input type="radio" name="plan" id="p-creator" value="creator" checked>
          <label for="p-creator">Creator<small>$19/mo</small></label>
          <input type="radio" name="plan" id="p-pro" value="pro">
          <label for="p-pro">Pro<small>$49/mo</small></label>
        </div>
      </div>
      <div class="auth-msg" id="msg"></div>
      <button class="btn block lg" type="submit" id="submit">Create account</button>
    </form>
    <div class="auth-alt">Already have an account? <a href="/login.html">Log in</a></div>
  </div>
</div>

<script>
// preselect plan from ?plan=creator etc.
const params = new URLSearchParams(location.search);
const wanted = params.get("plan");
if (wanted && document.getElementById("p-" + wanted)) document.getElementById("p-" + wanted).checked = true;

const form = document.getElementById("form"), msg = document.getElementById("msg"), submit = document.getElementById("submit");

// Social sign-in — creates/logs in via provider, then continues (index picks up any pending link).
document.querySelectorAll("[data-oauth]").forEach((b) => b.addEventListener("click", async () => {
  msg.className = "auth-msg"; msg.textContent = "Connecting…";
  try {
    const r = await fetch("/api/oauth/" + b.dataset.oauth, { method: "POST" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Sign-in failed");
    location.href = "/studio.html";
  } catch (e) { msg.className = "auth-msg err"; msg.textContent = e.message; }
}));
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "auth-msg"; msg.textContent = "";
  submit.disabled = true; submit.textContent = "Creating…";
  try {
    const r = await fetch("/api/register", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
        plan: form.plan.value,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Could not create account");
    msg.className = "auth-msg ok"; msg.textContent = "Account created! Redirecting…";
    location.href = "/studio.html";
  } catch (err) {
    msg.className = "auth-msg err"; msg.textContent = err.message;
    submit.disabled = false; submit.textContent = "Create account";
  }
});
</script>
</body>
</html>
